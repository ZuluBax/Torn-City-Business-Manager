<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Company Manager</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="booting">
  <a href="#main" class="skip-link">Skip to content</a>

  <header class="topbar">
    <button type="button" id="menu-btn" class="icon-btn" aria-label="Open menu">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <span class="topbar-title" id="topbar-name"></span>
  </header>

  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <img src="assets/logo.svg" alt="" class="brand-logo" width="40" height="40">
      <div>
        <strong id="brand-name"></strong>
        <span>Manager</span>
      </div>
    </div>
    <nav id="nav"></nav>
    <p class="sidebar-foot" id="storage-note"></p>
  </aside>
  <div id="scrim" class="scrim" aria-hidden="true"></div>

  <main id="main" class="main" tabindex="-1">
    <div class="loading">Loading…</div>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p class="noscript">This app needs JavaScript enabled.</p></noscript>

  <!-- Plain scripts (not ES modules) so the app works when index.html is opened directly from disk. Order matters. -->
  <script src="js/util.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/torn.js"></script>
  <script src="js/db.js"></script>
  <script src="js/services.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/employees.js"></script>
  <script src="js/views/training.js"></script>
  <script src="js/views/payments.js"></script>
  <script src="js/views/finances.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
